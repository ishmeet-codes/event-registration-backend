name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Trigger Render DEV Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set in DEV environment."
            exit 1
          fi
          echo "Triggering DEV deploy hook..."
          curl -s -X POST "$DEPLOY_HOOK_URL"

  deploy-prod:
    name: Deploy to PROD
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Trigger Render PROD Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set in PROD environment."
            exit 1
          fi
          echo "Triggering PROD deploy hook..."
          curl -s -X POST "$DEPLOY_HOOK_URL"
