# ── Production overrides ──────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=prod (set this in Render env vars)
#
# Deployment:
#   Backend  → https://event-registration-backend-r1jy.onrender.com  (Render)
#   Frontend → https://registration-management-system-fron.vercel.app (Vercel)
#
# All secrets below read from Render env-var panel; defaults are safe fallbacks.

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Suppress verbose SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Cookie settings for cross-origin (Vercel → Render) ───────────────────────
#
# REQUIRED for HttpOnly cookie to be sent cross-origin:
#   SameSite=None  — allows cross-site requests
#   Secure=true    — browser enforces HTTPS (required with SameSite=None)
#
# Set in Render env-var panel (already defaulted correctly here):
#   JWT_COOKIE_SAME_SITE = None
#   JWT_COOKIE_SECURE    = true
#
app.cookie.same-site=${JWT_COOKIE_SAME_SITE:None}
app.cookie.secure=${JWT_COOKIE_SECURE:true}
app.cookie.http-only=${JWT_COOKIE_HTTP_ONLY:true}
app.cookie.refresh-token-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
app.cookie.expires=${JWT_COOKIE_EXPIRES:604800}
# Leave blank — Render serves from a subdomain, no shared root domain needed
app.cookie.domain=${JWT_COOKIE_DOMAIN:}

# ── CORS allowed origins ──────────────────────────────────────────────────────
# Vercel frontend URL. Add more (comma-separated) if you add a custom domain.
# Override via CORS_ALLOWED_ORIGINS env var on Render if the URL changes.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://registration-management-system-fron.vercel.app,http://localhost:5173}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:15000}
app.mail.from=${MAIL_USERNAME}
# Password reset emails link to the Vercel frontend
app.mail.reset-password-base-url=${APP_BASE_URL:https://registration-management-system-fron.vercel.app}


# Health ping endpoint used by the scheduler
health.ping.url=${HEALTH_PING_URL:https://event-registration-backend-r1jy.onrender.com/api/health}

# Actuator Web Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false
