spring.application.name=registration.management.service

spring.datasource.url=jdbc:postgresql://localhost:5432/registration_management
spring.datasource.username=postgres
spring.datasource.password=192123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


app.mail.from=${MAIL_USERNAME}
app.mail.reset-password-base-url=${APP_BASE_URL:http://localhost:8080}

refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
cookie-secure=${JWT_COOKIE_SECURE:true}
cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
cookie-same-site=${JWT_COOKIE_SAME_SITE:true}