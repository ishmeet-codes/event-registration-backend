spring.application.name=registration.management.service

spring.datasource.url=jdbc:postgresql://localhost:5432/registration_management
spring.datasource.username=postgres
spring.datasource.password=192123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# ── Resend API Configuration (Replaces SMTP to bypass Render blocks) ──────────
resend.api.key=${RESEND_API_KEY:}
# Sender address uses your verified domain in Resend
app.mail.from=${APP_MAIL_FROM:noreply@varietyventures.in}
# Public URL of the frontend application. Password-reset emails must link to the
# frontend route, not to this API server.
app.mail.reset-password-base-url=${APP_BASE_URL:http://localhost:5173}

# ── Cookie configuration ──────────────────────────────────────────────────────
# Keys must match the @Value annotations in CookiesService.java exactly.
app.cookie.refresh-token-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
app.cookie.secure=${JWT_COOKIE_SECURE:true}
app.cookie.http-only=${JWT_COOKIE_HTTP_ONLY:true}
# SameSite=Lax works for same-site. Override to "None" in prod for cross-origin
app.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}
app.cookie.expires=${JWT_COOKIE_EXPIRES:604800}
# Leave blank for local dev; set to your backend domain in prod (e.g. api.railway.app)
app.cookie.domain=${JWT_COOKIE_DOMAIN:}

# ── Actuator Health Management ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

server.port=8080